<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPTV Grid Player</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f0f0f;
  color: white;
}

.header {
  padding: 15px;
  text-align: center;
  font-size: 22px;
  font-weight: bold;
  background: #141414;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 15px;
  padding: 20px;
}

.channel-card {
  background: #1c1c1c;
  border-radius: 10px;
  overflow: hidden;
  cursor: pointer;
  transition: 0.3s;
  text-align: center;
}

.channel-card:hover {
  transform: scale(1.05);
  background: #252525;
}

.channel-card img {
  width: 100%;
  height: 120px;
  object-fit: contain;
  background: #000;
}

.channel-name {
  padding: 8px;
  font-size: 14px;
}

/* PLAYER OVERLAY */
.overlay {
  position: fixed;
  display: none;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.9);
  justify-content: center;
  align-items: center;
  flex-direction: column;
  z-index: 999;
}

.overlay video {
  width: 80%;
  max-width: 900px;
}

.close-btn {
  margin-top: 10px;
  padding: 8px 15px;
  background: red;
  border: none;
  color: white;
  cursor: pointer;
  border-radius: 5px;
}
</style>
</head>
<body>

<div class="header">📺 IPTV Channel Grid</div>

<div class="grid" id="channelGrid"></div>

<!-- PLAYER OVERLAY -->
<div class="overlay" id="playerOverlay">
  <video id="videoPlayer" controls></video>
  <button class="close-btn" onclick="closePlayer()">Close</button>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.4.0/shaka-player.compiled.js"></script>

<script>
(async () => {

const playlistUrl = "https://raw.githubusercontent.com/reiyhbit/iptv/refs/heads/main/viva.m3u";
const response = await fetch(playlistUrl);
const text = await response.text();

const lines = text.split("\n").filter(l => l.trim() !== "");
let channels = [];

for (let i = 0; i < lines.length; i++) {
  if (lines[i].startsWith("#EXTINF")) {
    let name = lines[i].split(",")[1] || "Unknown";
    let logoMatch = lines[i].match(/tvg-logo="([^"]+)"/);
    let logo = logoMatch ? logoMatch[1] : "https://via.placeholder.com/150x120?text=No+Logo";
    let url = lines[i + 1] || "";
    channels.push({ name: name.trim(), logo: logo, url: url.trim() });
  }
}

const grid = document.getElementById("channelGrid");

channels.forEach(channel => {
  const card = document.createElement("div");
  card.className = "channel-card";
  card.innerHTML = `
    <img src="${channel.logo}">
    <div class="channel-name">${channel.name}</div>
  `;
  card.onclick = () => playChannel(channel.url);
  grid.appendChild(card);
});

})();

function playChannel(url) {
  const overlay = document.getElementById("playerOverlay");
  const video = document.getElementById("videoPlayer");

  overlay.style.display = "flex";

  if (Hls.isSupported()) {
    const hls = new Hls();
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, function() {
      video.play();
    });
  } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
    video.src = url;
    video.play();
  } else {
    shaka.polyfill.installAll();
    const player = new shaka.Player(video);
    player.load(url).catch(e => console.error(e));
  }
}

function closePlayer() {
  const overlay = document.getElementById("playerOverlay");
  const video = document.getElementById("videoPlayer");
  video.pause();
  video.src = "";
  overlay.style.display = "none";
}
</script>

</body>
</html>
