<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IPTV HLS Player</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #eee;
      margin: 0;
      padding: 0;
    }
    .header {
      background: #222;
      padding: 10px 20px;
      text-align: center;
      font-size: 1.5rem;
      font-weight: bold;
    }
    #player-container {
      display: flex;
      justify-content: center;
      margin-top: 15px;
    }
    #playlist {
      margin-top: 15px;
      max-height: 400px;
      overflow-y: auto;
      padding: 0 20px;
    }
    .channel {
      padding: 8px;
      border-bottom: 1px solid #333;
      cursor: pointer;
    }
    .channel:hover {
      background: #222;
    }
  </style>

  <!-- Video.js CSS -->
  <link href="https://vjs.zencdn.net/7.24.0/video-js.css" rel="stylesheet" />
</head>
<body>

<div class="header">📺 IPTV HLS Player</div>

<!-- Video Player -->
<div id="player-container">
  <video
    id="videoPlayer"
    class="video-js vjs-default-skin"
    controls
    width="800"
    height="450"
    preload="auto"
  ></video>
</div>

<!-- Playlist -->
<div id="playlist"></div>

<!-- Video.js + HLS.js + Shaka -->
<script src="https://vjs.zencdn.net/7.24.0/video.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.4.0/shaka-player.compiled.js"></script>

<script>
(async () => {
  const playlistUrl = "https://raw.githubusercontent.com/reiyhbit/iptv/refs/heads/main/viva.m3u";
  const playlistText = await fetch(playlistUrl).then(r => r.text());
  
  // Parse Simple M3U
  const lines = playlistText.split("\n").filter(l => l.trim() !== "");
  let channels = [];
  for (let i = 0; i < lines.length; i++) {
    if (lines[i].startsWith("#EXTINF")) {
      let nameMatch = lines[i].split(",")[1] || "Unknown";
      let streamUrl = lines[i + 1] || "";
      channels.push({ name: nameMatch.trim(), url: streamUrl.trim() });
    }
  }

  // Populate playlist UI
  const playlistDiv = document.getElementById("playlist");
  channels.forEach((ch, idx) => {
    const div = document.createElement("div");
    div.className = "channel";
    div.textContent = ch.name;
    div.onclick = () => playChannel(ch.url);
    playlistDiv.appendChild(div);
  });

  // Setup video.js player
  const videoEl = document.getElementById("videoPlayer");
  const player = videojs(videoEl);

  function playChannel(url) {
    if (Hls.isSupported()) {
      // HLS.js
      const hls = new Hls();
      hls.loadSource(url);
      hls.attachMedia(videoEl);
      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        videoEl.play();
      });
    } else if (videoEl.canPlayType("application/vnd.apple.mpegurl")) {
      // Native HLS
      videoEl.src = url;
      videoEl.play();
    } else {
      // Shaka fallback
      shaka.polyfill.installAll();
      const shakaPlayer = new shaka.Player(videoEl);
      shakaPlayer.load(url).catch(err => {
        console.error("Shaka playback failed:", err);
      });
    }
  }
})();
</script>

</body>
</html>
